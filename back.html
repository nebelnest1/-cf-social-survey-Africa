<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Redirecting…</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;color:#555;font:16px system-ui,sans-serif}</style>
</head>
<body><p id="status">Redirecting…</p>
<script>
(() => {
  'use strict';
  // Separate fallback back-page for the 2026 common.js history integration.
  // Match these IDs with the configured back exits. Never take redirect hosts from the URL.
  const allowedZones = new Set(['10217423','10740063','11764936']);
  const source = new URLSearchParams(location.search);
  const zone = source.get('zoneid');
  const domain = source.get('domain');
  if (!allowedZones.has(zone) || source.get('z') !== zone || domain !== 'https://upges.com') {
    document.getElementById('status').textContent = 'Back exit configuration error.';
    return;
  }
  const target = new URL('https://upges.com/afu.php');
  for (const [key,value] of source) {
    if (['domain','url','backPage'].includes(key)) continue;
    target.searchParams.append(key,value);
  }
  target.searchParams.set('zoneid',zone);
  target.searchParams.set('z',zone);
  location.replace(target.toString());
})();
</script>
</body>
</html>
