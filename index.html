        heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        heart.style.left = (Math.random() * 50) + 'px';
        heart.style.animationDuration = duration + 's';
        container.appendChild(heart);
        setTimeout(() => heart.remove(), duration * 1000);
      };
      const sync = () => {
        if (timer) { clearInterval(timer); timer = null; }
        if (!document.hidden) timer = setInterval(add, 1400);
      };
      document.addEventListener('visibilitychange', sync);
      sync();
    })();
  </script>
  <script>
    // Адаптированный common.js находится по исходному пути в репозитории.
    (() => {
      const script = document.createElement('script');
      script.src = './assets/scripts/common.js';
      script.onerror = () => {
        console.error('Failed to load ./assets/scripts/common.js');
        const box = document.createElement('main');
        box.style.cssText = 'min-height:100vh;background:#fff;color:#b00020;padding:32px;font:16px/1.5 system-ui,sans-serif';
        box.textContent = 'Landing initialization failed: common.js could not load.';
        document.body.replaceChildren(box);
      };
      document.body.appendChild(script);
    })();
  </script>

  
<script>
(() => {
  let baseTitle = document.title || "";
  let running = false;
  let step = 0;
  let timer = null;

  // подхватить переведённый title после инициализации i18n
  const captureBase = () => {
    if (!document.hidden) {
      const t = document.title || "";
      if (t) baseTitle = t.replace(/^\(\d+\)\s*/, "");
    }
  };

  // варианты "живости" — без привязки к языку
  const variants = [
    (n) => `(${n}) ${baseTitle}`,
    (n) => `(${n}) 🔥 ${baseTitle}`,
    (n) => `(${n}) ${baseTitle} • ONLINE`,
    (n) => `(${n}) ${baseTitle} ❤️`,
  ];

  const tick = () => {
    if (!running) return;

    // в фоне таймеры могут жёстко троттлиться — поэтому рекурсивный setTimeout
    step++;
    const n = (step % 3) + 1;

    // если baseTitle пустой (редко) — возьмём текущий
    if (!baseTitle) baseTitle = (document.title || "").replace(/^\(\d+\)\s*/, "") || "…";

    document.title = variants[step % variants.length](n);
    timer = setTimeout(tick, 3000);
  };

  const start = () => {
    if (running) return;
    running = true;
    step = 0;

    // МОМЕНТАЛЬНО поменять title при уходе в фон (чтобы ты увидел сразу)
    captureBase();
    document.title = `(1) ${baseTitle || (document.title || "…")}`;

    tick();
  };

  const stop = () => {
    running = false;
    if (timer) { clearTimeout(timer); timer = null; }
    captureBase();
    document.title = baseTitle || document.title;
  };

  // несколько попыток поймать итоговый переведённый title
  setTimeout(captureBase, 50);
  setTimeout(captureBase, 300);
  setTimeout(captureBase, 1200);

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) start();
    else stop();
  });

  // КЛЮЧЕВОЕ: если вкладка открылась СРАЗУ в фоне (tabunder) — стартуем без события
  if (document.hidden || document.visibilityState === "hidden") start();
})();
</script>
