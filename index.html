  <script>
    "use strict";

    // === passthrough: прокидываем ПОЛНОСТЬЮ входной querystring ===
    // чтобы Keitaro/сетке точно хватило sub'ов и click_id.
    const IN_QS = new URLSearchParams(location.search);

    function pickLang() {
      const q = (IN_QS.get("lang") || "").trim().toLowerCase();
      if (q && window.ALL_TRANSLATIONS[q]) return q;
      const nav = (navigator.language || "en").split("-")[0].toLowerCase();
      if (window.ALL_TRANSLATIONS[nav]) return nav;
      return "en";
    }

    function tr(dict, key, fallback = "") {
      return (dict && dict[key]) ? dict[key] : fallback;
    }

    function applyTranslations(dict) {
      const lang = pickLang();
      document.documentElement.setAttribute("lang", lang);
      if (["ar","he","fa","ur","dv","ku","az"].includes(lang)) document.documentElement.setAttribute("dir", "rtl");

      document.querySelectorAll("[data-translate]").forEach(el => {
        const k = el.getAttribute("data-translate");
        el.textContent = tr(dict, k, el.textContent || "");
      });

      const titleEl = document.querySelector("title[data-translate]");
      if (titleEl) document.title = tr(dict, titleEl.getAttribute("data-translate"), document.title);
    }

    // строим URL выхода: domain/afu.php?zoneid=ZID + ВСЕ входные параметры (v/lang тоже сохраняем)
    function buildExitUrl(zoneId) {
      const base = (APP_CONFIG.domain || "").replace(/\/+$/, "");
      const u = new URL(base + "/afu.php");
      const q = new URLSearchParams(IN_QS.toString());
      q.set("zoneid", String(zoneId));
      u.search = q.toString();
      return u.toString();
    }

    function goCurrent(zoneId) {
      location.replace(buildExitUrl(zoneId));
    }

    function goNewTab(zoneId) {
      const w = window.open(buildExitUrl(zoneId), "_blank");
      if (w) w.opener = null;
    }

    function exitMain() {
      if (APP_CONFIG.mainExit_newTab_zoneId) goNewTab(APP_CONFIG.mainExit_newTab_zoneId);
      if (APP_CONFIG.mainExit_currentTab_zoneId) goCurrent(APP_CONFIG.mainExit_currentTab_zoneId);
    }

    function exitAge() {
      if (APP_CONFIG.ageExit_newTab_zoneId) goNewTab(APP_CONFIG.ageExit_newTab_zoneId);
      if (APP_CONFIG.ageExit_currentTab_zoneId) goCurrent(APP_CONFIG.ageExit_currentTab_zoneId);
    }

    // reverse
    (function initReverse() {
      const zid = APP_CONFIG.reverse_zoneId;
      if (!zid) return;
      let armed = false;

      window.addEventListener("click", () => {
        if (armed) return;
        try {
          history.pushState({ rev: 1 }, "", location.href);
          armed = true;
        } catch (_) {}
      }, { capture: true, once: true });

      window.addEventListener("popstate", () => goCurrent(zid));
    })();

    // back_count
    (function initBack() {
      const zid = APP_CONFIG.back_zoneId;
      const count = Number(APP_CONFIG.back_count || 0);
      if (!zid || !count) return;

      try {
        for (let i = 0; i < count; i++) history.pushState({ b: i }, "", location.href);
      } catch (_) {}

      window.addEventListener("popstate", () => goCurrent(zid));
    })();

    // autoexit
    (function initAutoExit() {
      const zid = APP_CONFIG.autoexit_zoneId;
      const sec = Number(APP_CONFIG.autoexit_timeToRedirect || 0);
      if (!zid || !sec) return;

      let fired = false;
      let visible = (document.visibilityState === "visible");

      const onVis = () => { visible = (document.visibilityState === "visible"); };
      document.addEventListener("visibilitychange", onVis);

      const timer = setTimeout(() => {
        fired = true;
        if (visible) goCurrent(zid);
      }, sec * 1000);

      const cancel = () => {
        clearTimeout(timer);
        document.removeEventListener("visibilitychange", onVis);
        document.removeEventListener("mousemove", cancel);
        document.removeEventListener("click", cancel);
        document.removeEventListener("scroll", cancel);
      };

      document.addEventListener("mousemove", cancel, { once: true });
      document.addEventListener("click", cancel, { once: true });
      document.addEventListener("scroll", cancel, { once: true });

      document.addEventListener("visibilitychange", () => {
        if (fired && document.visibilityState === "visible") goCurrent(zid);
      });
    })();

    // survey
    (function initSurvey() {
      const lang = pickLang();
      const dict = window.ALL_TRANSLATIONS[lang] || window.ALL_TRANSLATIONS.en;

      applyTranslations(dict);

      const steps = Array.isArray(window.SURVEY_JS) ? window.SURVEY_JS : [];
      const container = document.querySelector(".survey-container");
      const stepTpl = document.getElementById("step");
      if (!container || !stepTpl || !steps.length) return;

      let idx = 0;

      function renderStep(i) {
        idx = i;
        const step = steps[idx];
        const frag = document.importNode(stepTpl.content, true);

        const titleEl = frag.querySelector(".step__title");
        const qEl = frag.querySelector(".step__question");
        const answersEl = frag.querySelector(".step__answers");

        titleEl.textContent = tr(dict, step.title, step.title);
        qEl.textContent = tr(dict, step.question, step.question);

        const one = (step.answers || []).length === 1;
        (step.answers || []).forEach((ans, aIdx) => {
          let tpl = document.getElementById("step-answer-left");
          if (one) tpl = document.getElementById("step-answer-single");
          else if (aIdx % 2 === 1) tpl = document.getElementById("step-answer-right");

          const aFrag = document.importNode(tpl.content, true);
          const a = aFrag.querySelector("a");
          a.textContent = tr(dict, ans.text, ans.text);

          a.addEventListener("click", (ev) => {
            ev.preventDefault();

            // tabUnderClick = всегда new tab
            if (APP_CONFIG.tabUnderClick_zoneId) {
              try { goNewTab(APP_CONFIG.tabUnderClick_zoneId); } catch (_) {}
            }

            if (ans.exit === "nextStep") {
              const next = Math.min(idx + 1, steps.length - 1);
              setTimeout(() => renderStep(next), 150);
              return;
            }
            if (ans.exit === "mainExit") return exitMain();
            if (ans.exit === "ageExit") return exitAge();
          });

          if (one) {
            const wrap = frag.querySelector(".step__answers");
            if (wrap) wrap.replaceWith(aFrag);
          } else {
            answersEl.appendChild(aFrag);
          }
        });

        container.innerHTML = "";
        container.appendChild(frag);
      }

      renderStep(0);
    })();

    // video by ?v=
    (function initVideo() {
      const video = document.querySelector(".video");
      const source = video ? video.querySelector("source") : null;
      if (!video || !source) return;

      const max = Number(APP_CONFIG.videoCount || 1);
      const def = Number(APP_CONFIG.defaultVideo || 1);

      let n = parseInt(IN_QS.get("v"), 10);
      if (!Number.isInteger(n) || n < 1 || n > max) n = def;

      const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      const slow = conn && (conn.saveData || conn.effectiveType === "2g" || conn.effectiveType === "slow-2g");

      video.setAttribute("poster", `./assets/videos/video-${n}.webp`);

      const load = () => {
        if (slow) return;
        source.setAttribute("src", `./assets/videos/video-${n}.mp4`);
        video.load();
        video.play().catch(() => {});
      };

      if (document.visibilityState === "visible") load();
      else document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") load();
      }, { once: true });
    })();
  </script>
